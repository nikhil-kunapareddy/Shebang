name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore windows/GhostHand.sln

      - name: Build solution
        run: dotnet build windows/GhostHand.sln -c Release --no-restore

      - name: Run unit tests
        run: dotnet test windows/GhostHand.sln -c Release --no-build --logger "console;verbosity=normal"

  test-macos:
    runs-on: macos-15

    defaults:
      run:
        working-directory: macos

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Swift toolchain
        run: swift --version

      - name: Build package
        run: swift build

      - name: Run unit tests
        run: ./Scripts/test.sh

      - name: Build app bundle
        run: ./Scripts/build-app.sh
