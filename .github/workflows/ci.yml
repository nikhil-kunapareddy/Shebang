name: CI

# Every run builds and tests Shebang.app and uploads the DMG and zip as a workflow artifact.
# Pushes to main (and v* tags) also publish a GitHub Release named after the version in
# macos/Resources/Info.plist, unless that release already exists: bump
# CFBundleShortVersionString to ship a new one.

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 20

    defaults:
      run:
        working-directory: macos

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Swift toolchain
        run: swift --version

      - name: Read app version
        id: version
        run: echo "version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)" >> "$GITHUB_OUTPUT"

      # A one-thread concurrency pool makes code that blocks the pool deadlock on every runner, not
      # only on runners with few cores.
      - name: Run unit tests
        run: ./Scripts/test.sh
        env:
          LIBDISPATCH_COOPERATIVE_POOL_STRICT: 1

      - name: Install dmgbuild
        run: |
          python3 -m venv "$RUNNER_TEMP/dmgbuild"
          "$RUNNER_TEMP/dmgbuild/bin/pip" install --quiet 'dmgbuild==1.6.7'
          echo "$RUNNER_TEMP/dmgbuild/bin" >> "$GITHUB_PATH"

      - name: Build Shebang.app, DMG, and zip
        run: ./Scripts/build-app.sh --zip --dmg

      # Upload the DMG and ditto zip rather than the .app: artifacts drop executable bits and symlinks.
      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: Shebang-v${{ steps.version.outputs.version }}-macos-arm64
          path: |
            macos/dist/Shebang-*-macos-*.dmg
            macos/dist/Shebang-*-macos-*.dmg.sha256
            macos/dist/Shebang-*-macos-*.zip
            macos/dist/Shebang-*-macos-*.zip.sha256
          if-no-files-found: error

  release:
    needs: build
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    permissions:
      contents: write

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      TAG: v${{ needs.build.outputs.version }}

    steps:
      - name: Download app artifact
        uses: actions/download-artifact@v4
        with:
          name: Shebang-v${{ needs.build.outputs.version }}-macos-arm64
          path: dist

      - name: Publish GitHub Release
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "$TAG" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Info.plist version $TAG."
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::notice::Release $TAG already exists. Bump CFBundleShortVersionString in macos/Resources/Info.plist to publish a new one."
            exit 0
          fi
          gh release create "$TAG" dist/* --target "$GITHUB_SHA" --title "Shebang $TAG" --generate-notes --latest
