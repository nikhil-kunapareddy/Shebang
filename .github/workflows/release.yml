name: Build and Publish Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore windows/GhostHand.sln

      - name: Run unit tests
        run: dotnet test windows/GhostHand.sln --configuration Release --no-restore --logger "console;verbosity=normal"

      - name: Publish GhostHand.App (win-x64 self-contained)
        run: >
          dotnet publish windows/src/GhostHand.App/GhostHand.App.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishReadyToRun=true
          -o release-pkg/GhostHand-win-x64

      - name: Publish GhostHand.Cli (win-x64 self-contained)
        run: >
          dotnet publish windows/src/GhostHand.Cli/GhostHand.Cli.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishReadyToRun=true
          -o release-pkg/GhostHand-win-x64

      - name: Bundle distribution files
        shell: pwsh
        run: |
          if (Test-Path ".env.example") {
            Copy-Item -Path ".env.example" -Destination "release-pkg/GhostHand-win-x64/.env.example" -Force
          }
          if (Test-Path "windows/packaging") {
            Copy-Item -Path "windows/packaging/*" -Destination "release-pkg/GhostHand-win-x64/" -Force -Recurse
          }
          $tag = if ($env:GITHUB_REF_NAME) { $env:GITHUB_REF_NAME } else { "v0.1.0" }
          Compress-Archive -Path "release-pkg/GhostHand-win-x64/*" -DestinationPath "GhostHand-$tag-win-x64.zip" -Force

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          files: GhostHand-*-win-x64.zip
          draft: false
          prerelease: false
          generate_release_notes: true

  build-macos:
    runs-on: macos-15

    defaults:
      run:
        working-directory: macos

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run unit tests
        run: ./Scripts/test.sh

      - name: Build and zip GhostHand.app
        run: ./Scripts/build-app.sh --zip

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          files: |
            macos/dist/GhostHand-*-macos-*.zip
            macos/dist/GhostHand-*-macos-*.zip.sha256
