name: Build and Publish Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-15

    defaults:
      run:
        working-directory: macos

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run unit tests
        run: ./Scripts/test.sh

      - name: Build and zip Shebang.app
        run: ./Scripts/build-app.sh --zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          files: |
            macos/dist/Shebang-*-macos-*.zip
            macos/dist/Shebang-*-macos-*.zip.sha256
          draft: false
          prerelease: false
          generate_release_notes: true
